{% extends "user_center_base.html" %}

{% block title_prefix %}{{ t(key="change_password", lang=lang) }} - {{ site_config.site_name }}{% endblock %}

{% block user_content %}
<h2 class="text-2xl font-bold text-gray-800 mb-6">{{ t(key="change_password", lang=lang) }}</h2>

<div id="password-message" class="mb-4 text-sm"></div>

<form id="password-form" class="space-y-4 max-w-md">
    <div>
        <label class="block text-sm font-medium text-gray-700">{{ t(key="old_password", lang=lang) }}</label>
        <input type="password" id="old_password" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-purple-500">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700">{{ t(key="new_password", lang=lang) }}</label>
        <input type="password" id="new_password" required minlength="6" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-purple-500">
        <p class="text-xs text-gray-500 mt-1">{{ t(key="password_length", lang=lang) }}</p>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700">{{ t(key="confirm_password", lang=lang) }}</label>
        <input type="password" id="confirm_password" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-purple-500">
    </div>
    <div>
        <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded transition">{{ t(key="change_password", lang=lang) }}</button>
    </div>
</form>

<script>
    const translations = {
        'password_mismatch': '{{ t(key="password_mismatch", lang=lang) }}',
        'password_success': '{{ t(key="password_success", lang=lang) }}',
        'password_failed': '{{ t(key="password_failed", lang=lang) }}',
        'old_password_required': '{{ t(key="old_password_required", lang=lang) }}',
        'new_password_required': '{{ t(key="new_password_required", lang=lang) }}',
        'confirm_password_required': '{{ t(key="confirm_password_required", lang=lang) }}',
    };

    document.getElementById('password-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const oldPassword = document.getElementById('old_password').value.trim();
        const newPassword = document.getElementById('new_password').value.trim();
        const confirmPassword = document.getElementById('confirm_password').value.trim();

        if (!oldPassword || !newPassword || !confirmPassword) {
            document.getElementById('password-message').innerHTML = `<span class="text-red-600">${translations.old_password_required || '请填写完整'}</span>`;
            return;
        }
        if (newPassword !== confirmPassword) {
            document.getElementById('password-message').innerHTML = `<span class="text-red-600">${translations.password_mismatch}</span>`;
            return;
        }
        if (newPassword.length < 6) {
            document.getElementById('password-message').innerHTML = `<span class="text-red-600">{{ t(key="password_length", lang=lang) }}</span>`;
            return;
        }

        try {
            const result = await apiCall('PUT', '/api/me/password', {
                old_password: oldPassword,
                new_password: newPassword
            });
            document.getElementById('password-message').innerHTML = `<span class="text-green-600">${translations.password_success}</span>`;
            // 清空表单
            document.getElementById('password-form').reset();
            // 可选：3秒后跳转到登录页（因为可能需要重新登录）
            // setTimeout(() => { window.location.href = '/login'; }, 2000);
        } catch (err) {
            document.getElementById('password-message').innerHTML = `<span class="text-red-600">${translations.password_failed || err.message}</span>`;
        }
    });
</script>
{% endblock %}
