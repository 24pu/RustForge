{% extends "base.html" %}

{% block title_prefix %}{{ t(key="register", lang=lang) }} - {{ site_config.site_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="bg-white rounded-lg shadow p-8">
        <h1 class="text-2xl font-bold text-center mb-6">{{ t(key="register", lang=lang) }}</h1>
        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">{{ t(key="email", lang=lang) }}</label>
                <input type="email" id="email" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-purple-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">{{ t(key="name", lang=lang) }}</label>
                <input type="text" id="name" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-purple-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">{{ t(key="password", lang=lang) }}</label>
                <input type="password" id="password" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-purple-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">{{ t(key="confirm_password", lang=lang) }}</label>
                <input type="password" id="confirm_password" required class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-purple-500">
            </div>
            <div id="register-message" class="text-sm"></div>
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded transition">{{ t(key="register", lang=lang) }}</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">
            {{ t(key="has_account", lang=lang) }} <a href="/login" class="text-purple-600 hover:underline">{{ t(key="login_now", lang=lang) }}</a>
        </p>
    </div>
</div>

<script>
    // 如果已登录，直接跳转到用户中心
    if (document.cookie.split(';').some(c => c.trim().startsWith('auth_token='))) {
        window.location.href = '/user/profile';
    }

    document.getElementById('register-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const name = document.getElementById('name').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;
        if (password !== confirm) {
            document.getElementById('register-message').innerHTML = `<span class="text-red-600">{{ t(key="password_mismatch", lang=lang) }}</span>`;
            return;
        }
        try {
            const result = await apiCall('POST', '/api/register', { email, name, password });
            if (result && result.success) {
                window.location.href = '/login?registered=true';
            } else {
                document.getElementById('register-message').innerHTML = `<span class="text-red-600">${result.error || '{{ t(key="register_failed", lang=lang) }}'}</span>`;
            }
        } catch (err) {
            document.getElementById('register-message').innerHTML = `<span class="text-red-600">{{ t(key="register_failed", lang=lang) }}</span>`;
        }
    });
</script>
{% endblock %}
