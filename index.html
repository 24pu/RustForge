<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简谱 SVG 渲染器（本地 abcjs）</title>
    <!-- 使用与模板相同的路径 -->
    <script src="/lib/abcjs/abcjs-basic-min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f7f5f0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 24px;
        }
        .editor-area {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .editor-area textarea {
            flex: 1;
            min-width: 300px;
            height: 300px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            padding: 12px;
            border: 1px solid #d0c8c0;
            border-radius: 8px;
            background: #fcfaf8;
            resize: vertical;
        }
        .preview-area {
            flex: 1;
            min-width: 300px;
            background: #fcfaf8;
            border: 1px solid #d0c8c0;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            min-height: 200px;
        }
        .preview-area svg {
            width: 100%;
            height: auto;
            background: white;
            border-radius: 4px;
        }
        .controls {
            margin: 16px 0;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 8px 24px;
            background: #8a7a6a;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .controls button:hover {
            background: #6a5a4a;
        }
        .controls label {
            font-size: 14px;
            color: #5d4e3e;
        }
        .controls input[type="number"] {
            width: 60px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .status {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            background: #d1fae5;
            color: #065f46;
        }
        .error {
            color: #b3533c;
            font-weight: bold;
            margin: 8px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎵 简谱 SVG 渲染器（本地 abcjs）</h1>
    <p>在左侧输入 ABC 乐谱，右侧自动生成简谱 SVG。</p>

    <div class="controls">
        <span class="status" id="statusLabel">✅ abcjs 已加载（本地）</span>
        <button id="renderBtn">🔄 渲染</button>
        <label>字体大小 <input type="number" id="fontSize" value="28" min="16" max="48"></label>
        <label>间距 <input type="number" id="spacing" value="32" min="20" max="60"></label>
    </div>
    <div id="errorMsg" class="error"></div>

    <div class="editor-area">
        <textarea id="abcInput" spellcheck="false">
X: 1
T: 小星星
M: 4/4
K: C
C C G G | A A G2 | F F E E | D D C2 |
        </textarea>
        <div class="preview-area" id="svgPreview">
            <div style="color:#999; text-align:center; padding:40px 0;">等待渲染...</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ============================================================
        // 0. 检测 abcjs 是否加载成功（使用与模板相同的全局对象）
        // ============================================================
        const statusLabel = document.getElementById('statusLabel');
        const renderBtn = document.getElementById('renderBtn');
        const abcInput = document.getElementById('abcInput');
        const previewDiv = document.getElementById('svgPreview');
        const errorDiv = document.getElementById('errorMsg');
        const fontSizeInput = document.getElementById('fontSize');
        const spacingInput = document.getElementById('spacing');

        let abcjsReady = false;

        if (typeof abcjs !== 'undefined' && abcjs.parseAbc) {
            abcjsReady = true;
            statusLabel.textContent = '✅ abcjs 已加载（本地）';
            statusLabel.className = 'status success';
            renderBtn.disabled = false;
        } else {
            abcjsReady = false;
            statusLabel.textContent = '❌ abcjs 未加载，请检查路径 /lib/abcjs/abcjs-basic-min.js';
            statusLabel.className = 'status error';
            renderBtn.disabled = true;
            previewDiv.innerHTML = '<div style="color:#b3533c;text-align:center;padding:40px 0;">❌ abcjs 库未加载，请确认路径正确。</div>';
            return;
        }

        // ============================================================
        // 1. 简谱 → SVG 渲染核心（增强容错）
        // ============================================================

        function renderJianpuSVG(abcText, fontSize, noteSpacing) {
            let tune;
            try {
                const parsed = abcjs.parseAbc(abcText);
                if (!parsed || parsed.length === 0) {
                    return '<div style="color:#999;">⚠️ 未解析到有效乐谱。</div>';
                }
                tune = parsed[0];
                // 调试：输出 tune 结构（可在控制台查看）
                console.log('解析结果:', tune);
            } catch (e) {
                return `<div style="color:#b3533c;">❌ 解析错误: ${e.message}</div>`;
            }

            // 从 tune.lines 提取音符
            const lines = tune.lines || [];
            if (!lines.length) {
                return '<div style="color:#999;">⚠️ 乐谱为空。</div>';
            }

            const fs = parseInt(fontSize) || 28;
            const spacing = parseInt(noteSpacing) || 32;
            const dotRadius = fs * 0.12;
            const lineWidth = fs * 0.06;

            let totalWidth = 0;
            let maxPitch = 0;
            let minPitch = 0;
            const elements = [];

            function getVerticalOffset(octave) {
                if (octave > 4) return -fs * 0.45;
                if (octave < 4) return fs * 0.45;
                return 0;
            }

            // 遍历所有行
            for (let li = 0; li < lines.length; li++) {
                const line = lines[li];
                let xPos = 0;
                // 取第一个 staff 的第一个 voice（简谱通常单声部）
                if (line.staff && line.staff.length > 0) {
                    // 有时 line.staff[0].voices 是数组，也可能直接是对象
                    let voice = line.staff[0].voices;
                    // 如果 voice 是数组，取第一个；否则直接使用
                    if (Array.isArray(voice) && voice.length > 0) {
                        voice = voice[0];
                    }
                    if (!voice) voice = [];
                    for (let ei = 0; ei < voice.length; ei++) {
                        const item = voice[ei];
                        const type = item.type || item.el_type || '';
                        if (type === 'note' || type === 'rest') {
                            const pitchObj = item.pitch || {};
                            const step = pitchObj.step || 'C';
                            const octave = pitchObj.octave || 4;
                            const accidental = pitchObj.accidental || '';
                            const duration = item.duration || 0;
                            const dots = item.dots || 0;
                            const rest = item.rest;
                            const stepMap = { 'C': 1, 'D': 2, 'E': 3, 'F': 4, 'G': 5, 'A': 6, 'B': 7 };
                            let num = stepMap[step] || 0;
                            if (rest) num = 0;
                            let accSymbol = '';
                            if (accidental === '#') accSymbol = '♯';
                            else if (accidental === 'b') accSymbol = '♭';

                            const vertOffset = getVerticalOffset(octave);
                            maxPitch = Math.max(maxPitch, octave);
                            minPitch = Math.min(minPitch, octave);

                            let dashCount = 0;
                            let underlineCount = 0;
                            if (duration >= 0.9) dashCount = 3;
                            else if (duration >= 0.4) dashCount = 1;
                            else if (duration >= 0.22) dashCount = 0;
                            else if (duration >= 0.1) underlineCount = 1;
                            else if (duration >= 0.04) underlineCount = 2;
                            else underlineCount = 3;

                            const hasDot = dots > 0;

                            elements.push({
                                type: 'note',
                                num: num,
                                accSymbol: accSymbol,
                                octave: octave,
                                vertOffset: vertOffset,
                                dashCount: dashCount,
                                underlineCount: underlineCount,
                                hasDot: hasDot,
                                x: xPos,
                                duration: duration,
                                rest: rest,
                            });
                            xPos += spacing;
                        } else if (type === 'bar' || type === 'barline') {
                            const barType = item.barType || item.type;
                            const isDouble = (barType === 'double' || barType === 'end' || barType === 'dbl');
                            elements.push({
                                type: 'barline',
                                x: xPos,
                                isDouble: isDouble,
                            });
                            xPos += spacing * 0.5;
                        } else if (type === 'chord') {
                            const chordName = item.chordName || '';
                            if (chordName) {
                                elements.push({
                                    type: 'chord',
                                    text: chordName,
                                    x: xPos,
                                });
                            }
                        }
                        // 其他类型忽略
                    }
                }
                totalWidth = Math.max(totalWidth, xPos);
            }

            // 如果没有元素，返回空
            if (!elements.length) {
                return '<div style="color:#999;">⚠️ 没有可渲染的音符。</div>';
            }

            const baseY = fs * 1.5;
            const pitchRange = maxPitch - minPitch + 1;
            const staffHeight = pitchRange * fs * 0.6 + fs * 1.2;
            const svgWidth = totalWidth + fs * 2;
            const svgHeight = staffHeight + fs * 2;

            let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${svgWidth} ${svgHeight}" 
                       style="font-family: 'Times New Roman', serif; background: #faf8f5;">
                        <style>
                            .note-text { font-size: ${fs}px; font-weight: 600; fill: #2d1f12; }
                            .accidental { font-size: ${fs*0.6}px; fill: #b3533c; }
                            .dot { fill: #2d1f12; }
                            .barline { stroke: #6a5a4a; stroke-width: ${lineWidth*1.5}; }
                            .barline-double { stroke: #6a5a4a; stroke-width: ${lineWidth*1.5}; }
                            .chord-text { font-size: ${fs*0.5}px; fill: #a05030; font-weight: bold; }
                            .dash-line { stroke: #7a6a5a; stroke-width: ${lineWidth*1.2}; stroke-linecap: round; }
                            .underline { stroke: #2d1f12; stroke-width: ${lineWidth*1.5}; }
                            .rest-text { font-size: ${fs}px; font-weight: 700; fill: #8a7a6a; }
                        </style>
                        <g transform="translate(${fs}, ${baseY + staffHeight/2})">`;

            for (const el of elements) {
                if (el.type === 'note') {
                    const x = el.x;
                    const y = el.vertOffset;
                    const numStr = el.num.toString();
                    const isRest = el.rest && (el.rest.type === 'rest' || el.rest.type === 'whole' || el.rest.type === 'half');
                    const displayText = isRest ? '0' : numStr;
                    const textColor = isRest ? '#8a7a6a' : '#2d1f12';

                    svg += `<text x="${x}" y="${y}" class="note-text" text-anchor="middle" fill="${textColor}">${displayText}</text>`;

                    if (el.accSymbol && !isRest) {
                        svg += `<text x="${x - fs*0.4}" y="${y - fs*0.2}" class="accidental" text-anchor="middle">${el.accSymbol}</text>`;
                    }

                    if (el.octave > 4 && !isRest) {
                        svg += `<circle cx="${x}" cy="${y - fs*0.5}" r="${dotRadius}" class="dot"/>`;
                    }
                    if (el.octave < 4 && !isRest) {
                        svg += `<circle cx="${x}" cy="${y + fs*0.5}" r="${dotRadius}" class="dot"/>`;
                    }

                    if (el.dashCount > 0 && !isRest) {
                        const dashLen = fs * 0.3 * el.dashCount;
                        const startX = x + fs * 0.2;
                        for (let i = 0; i < el.dashCount; i++) {
                            const dx = i * fs * 0.35;
                            svg += `<line x1="${startX + dx}" y1="${y}" x2="${startX + dx + dashLen}" y2="${y}" class="dash-line"/>`;
                        }
                    }

                    if (el.underlineCount > 0 && !isRest) {
                        const underY = y + fs * 0.3;
                        const lineLen = fs * 0.5;
                        const startX = x - lineLen/2;
                        for (let i = 0; i < el.underlineCount; i++) {
                            const dy = i * (fs * 0.08 + 1);
                            svg += `<line x1="${startX}" y1="${underY + dy}" x2="${startX + lineLen}" y2="${underY + dy}" class="underline"/>`;
                        }
                    }

                    if (el.hasDot && !isRest) {
                        svg += `<text x="${x + fs*0.45}" y="${y - fs*0.05}" class="note-text" font-size="${fs*0.7}px">·</text>`;
                    }

                } else if (el.type === 'barline') {
                    const x = el.x;
                    if (el.isDouble) {
                        svg += `<line x1="${x - 2}" y1="${-staffHeight/2}" x2="${x - 2}" y2="${staffHeight/2}" class="barline-double"/>`;
                        svg += `<line x1="${x + 2}" y1="${-staffHeight/2}" x2="${x + 2}" y2="${staffHeight/2}" class="barline-double"/>`;
                    } else {
                        svg += `<line x1="${x}" y1="${-staffHeight/2}" x2="${x}" y2="${staffHeight/2}" class="barline"/>`;
                    }
                } else if (el.type === 'chord') {
                    const x = el.x;
                    svg += `<text x="${x}" y="${-staffHeight/2 - fs*0.2}" class="chord-text" text-anchor="middle">${el.text}</text>`;
                }
            }

            svg += `</g></svg>`;
            return svg;
        }

        // ============================================================
        // 2. 渲染函数与 UI 绑定
        // ============================================================

        function render() {
            if (!abcjsReady) {
                previewDiv.innerHTML = '<div style="color:#b3533c;">❌ abcjs 未就绪，无法渲染。</div>';
                return;
            }
            const abc = abcInput.value.trim();
            if (!abc) {
                previewDiv.innerHTML = '<div style="color:#999;">请输入 ABC 乐谱。</div>';
                errorDiv.textContent = '';
                return;
            }
            const fs = parseInt(fontSizeInput.value) || 28;
            const sp = parseInt(spacingInput.value) || 32;
            try {
                const svg = renderJianpuSVG(abc, fs, sp);
                previewDiv.innerHTML = svg;
                errorDiv.textContent = '';
            } catch (e) {
                errorDiv.textContent = '❌ 渲染错误: ' + e.message;
                previewDiv.innerHTML = '';
            }
        }

        renderBtn.addEventListener('click', render);
        let timer;
        abcInput.addEventListener('input', function() {
            clearTimeout(timer);
            timer = setTimeout(render, 400);
        });
        fontSizeInput.addEventListener('change', render);
        spacingInput.addEventListener('change', render);

        // 初次自动渲染
        render();
    })();
</script>
</body>
</html>
