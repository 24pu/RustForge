<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musictool 插件设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-2xl mx-auto">
        <h3 class="text-xl font-semibold text-gray-800 mb-2">导航栏钩子设置</h3>
        <p class="text-sm text-gray-500 mb-4">为不同语言版本设置导航栏内容，保存后将自动在对应语言页面显示。</p>

        <div class="bg-white rounded-lg shadow p-4">
            <!-- 语言选择 -->
            <div class="mb-4 flex items-center gap-3 flex-wrap">
                <label for="lang-select" class="text-sm font-medium text-gray-700">语言版本</label>
                <select id="lang-select" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:ring-2 focus:ring-purple-500">
                    <!-- 选项将动态填充 -->
                </select>
                <span id="lang-status" class="text-xs text-gray-400 italic ml-1"></span>
            </div>

            <!-- 一键添加按钮 -->
            <div class="mb-3 flex flex-wrap items-center gap-2">
                <button id="add-nav-btn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md transition shadow-sm text-sm">
                    <i class="fas fa-plus mr-1"></i> 一键添加“调音器”到导航栏
                </button>
                <span class="text-xs text-gray-400">（将根据当前语言版本添加）</span>
            </div>

            <label for="nav-content" class="block text-sm font-medium text-gray-700 mb-2">链接 HTML 内容</label>
            <textarea id="nav-content" rows="6" class="w-full border border-gray-300 rounded-md p-3 font-mono text-sm focus:ring-2 focus:ring-purple-500 focus:border-transparent"></textarea>

            <div class="mt-4 flex justify-end space-x-2">
                <button id="save-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-md transition shadow-sm">
                    保存设置
                </button>
                <button id="delete-btn" class="bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-md transition shadow-sm">
                    删除当前版本
                </button>
            </div>
            <div id="message" class="mt-3 text-sm font-medium text-center"></div>
        </div>
    </div>

    <!-- 引用外部 JS -->
    <script src="/plugins/musictool/static/settings.js"></script>
</body>
</html>
