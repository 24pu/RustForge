<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ tuner_title }}</title>
    <link rel="stylesheet" href="/plugins/musictool/static/tuner.css" />
    <!-- Font Awesome (可选) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

            <!-- 头部 -->
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-100">
                <h1 class="text-2xl font-bold text-dark flex items-center gap-2">
                    <i class="fas fa-tune text-accent"></i>
                    {{ tuner_title }}
                </h1>
                <p class="text-sm text-gray-500 mt-1">{{ tuner_subtitle }}</p>
            </div>

            <!-- 主体 -->
            <div class="p-5 space-y-5">

                <!-- 乐器选择 (由 JS 动态渲染) -->
                <div class="flex flex-wrap gap-2 justify-center" id="instrumentSelector"></div>

                <!-- 基准频率切换 -->
                <div class="flex flex-wrap gap-2 justify-center">
                    <button class="base-btn px-4 py-2 rounded-full text-sm font-medium transition bg-accent text-white"
                            data-base="440" onclick="window.switchBase(440)">
                        A4 = 440 Hz
                    </button>
                    <button class="base-btn px-4 py-2 rounded-full text-sm font-medium transition bg-gray-100 text-gray-700 hover:bg-accent hover:text-white"
                            data-base="432" onclick="window.switchBase(432)">
                        A4 = 432 Hz
                    </button>
                </div>

                <!-- 当前目标 -->
                <div class="bg-dark rounded-2xl p-4 text-white text-center">
                    <div class="text-xs opacity-70">{{ current_target }}</div>
                    <div class="text-4xl font-bold mt-1" id="targetString">E2</div>
                    <div class="text-sm opacity-80" id="targetFreq">82.41 Hz</div>
                </div>

                <!-- 音分显示 -->
                <div class="text-center">
                    <div class="text-6xl font-mono font-bold" id="centsValue">0</div>
                    <div class="text-xs text-gray-400 mt-1" id="detectedHint">{{ waiting_detection }}</div>
                </div>

                <!-- 调音表 -->
                <div>
                    <div class="flex justify-between text-xs text-gray-500 mb-1 px-1">
                        <span>{{ flat }}</span>
                        <span>{{ standard }}</span>
                        <span>{{ sharp }}</span>
                    </div>
                    <div class="relative w-full h-6 bg-gray-200 rounded-full overflow-hidden">
                        <div class="h-full transition-all duration-75" id="meterFill"
                             style="width:50%; background: linear-gradient(90deg, #f44336, #ff9800, #4caf50, #4caf50, #ff9800, #f44336)">
                        </div>
                        <div class="absolute left-1/2 top-0 w-0.5 h-full bg-gray-800 transform -translate-x-1/2"></div>
                    </div>
                </div>

                <!-- 清晰度 -->
                <div>
                    <div class="flex justify-between text-xs text-gray-500 mb-1">
                        <span>{{ clarity_label }}</span>
                        <span id="clarityPercent">0%</span>
                    </div>
                    <div class="h-1.5 bg-gray-200 rounded-full overflow-hidden">
                        <div class="h-full bg-accent transition-all duration-100" id="clarityFill" style="width:0%"></div>
                    </div>
                </div>

                <!-- 琴弦列表 (动态) -->
                <div id="stringsContainer" class="strings-container"></div>

                <!-- 控制按钮 -->
                <div class="flex gap-3">
                    <button id="startBtn" class="flex-1 bg-accent hover:bg-accent-dark text-white font-semibold py-2 rounded-full transition">
                        {{ start_tuner }}
                    </button>
                    <button id="stopBtn" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 rounded-full transition disabled:opacity-50" disabled>
                        {{ stop }}
                    </button>
                </div>

                <!-- 状态信息 -->
                <div class="text-center text-sm text-gray-500 bg-gray-50 rounded-full py-2 px-3" id="statusMsg">
                    {{ instruction }}
                </div>

                <!-- 页脚 -->
                <div class="text-center text-xs text-gray-400 border-t border-gray-100 pt-4">
                    <span>{{ footer_text }}</span>
                    <div class="mt-2 inline-block bg-accent/10 text-accent px-3 py-1 rounded-full text-xs">
                        {{ feature_text }}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 导入映射 (用于 pitchy 库) -->
    <script type="importmap">
        {
            "imports": {
                "pitchy": "https://esm.sh/pitchy@4"
            }
        }
    </script>
    <!-- 调音器核心脚本 -->
    <script type="module" src="/plugins/musictool/static/tuner.js"></script>
</body>
</html>
