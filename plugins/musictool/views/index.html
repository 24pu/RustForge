<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ musictool_title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        .tool-card {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(124, 58, 237, 0.15);
            border-color: #7c3aed;
        }
        .tool-icon {
            font-size: 3rem;
            color: #7c3aed;
        }
        .tool-card .tool-icon-wrapper {
            background: rgba(124, 58, 237, 0.08);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            transition: all 0.3s ease;
        }
        .tool-card:hover .tool-icon-wrapper {
            background: rgba(124, 58, 237, 0.18);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

            <!-- 头部 -->
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-100">
                <h1 class="text-2xl font-bold text-dark flex items-center gap-2">
                    <i class="fas fa-music text-accent"></i>
                    {{ musictool_title }}
                </h1>
                <p class="text-sm text-gray-500 mt-1">{{ musictool_subtitle }}</p>
            </div>

            <!-- 工具列表 -->
            <div class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- 调音器 -->
                    <a href="/plugins/musictool/tiaoyin" class="tool-card bg-white rounded-xl p-6 text-center hover:shadow-lg transition cursor-pointer">
                        <div class="tool-icon-wrapper">
                            <i class="fas fa-music tool-icon"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-800">{{ tuner_title }}</h3>
                        <p class="text-sm text-gray-500 mt-1">{{ tuner_desc }}</p>
                        <div class="mt-3 inline-block px-4 py-1 bg-accent/10 text-accent rounded-full text-xs font-medium">
                            {{ tuner_badge }}
                        </div>
                    </a>

                    <!-- 节拍器 -->
                    <a href="/plugins/musictool/jiepai" class="tool-card bg-white rounded-xl p-6 text-center hover:shadow-lg transition cursor-pointer">
                        <div class="tool-icon-wrapper">
                            <i class="fas fa-clock tool-icon"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-800">{{ metronome_title }}</h3>
                        <p class="text-sm text-gray-500 mt-1">{{ metronome_desc }}</p>
                        <div class="mt-3 inline-block px-4 py-1 bg-accent/10 text-accent rounded-full text-xs font-medium">
                            {{ metronome_badge }}
                        </div>
                    </a>

                    <!-- 音阶练习器 -->
                    <a href="/plugins/musictool/yinjie" class="tool-card bg-white rounded-xl p-6 text-center hover:shadow-lg transition cursor-pointer block">
                        <div class="tool-icon-wrapper">
                            <i class="fas fa-guitar tool-icon"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-800">{{ yinjie_title }}</h3>
                        <p class="text-sm text-gray-500 mt-1">{{ yinjie_desc }}</p>
                        <div class="mt-3 inline-block px-4 py-1 bg-accent/10 text-accent rounded-full text-xs font-medium">
                            {{ yinjie_badge }}
                        </div>
                    </a>

                </div>

                <!-- 更多工具预告 -->
                <div class="mt-6 text-center text-sm text-gray-400 border-t border-gray-100 pt-4">
                    <span>{{ more_tools }}</span>
                </div>
            </div>

            <!-- 页脚 -->
            <div class="text-center text-xs text-gray-400 border-t border-gray-100 pt-4 px-5 pb-4">
                <span>{{ footer_text }}</span>
            </div>
        </div>
    </div>
</body>
</html>
