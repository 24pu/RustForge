<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品属性管理 - 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }
        .loading.show { display: block; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .toast {
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .attribute-select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            background-color: white;
            transition: all 0.2s;
        }
        .attribute-select:focus {
            outline: none;
            ring: 2px solid #3b82f6;
            border-color: #3b82f6;
        }
        .attribute-card {
            transition: all 0.2s;
        }
        .attribute-card:hover {
            border-color: #93c5fd;
            box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1);
        }
        .attribute-value-display {
            display: inline-block;
            background-color: #e0e7ff;
            color: #3730a3;
            font-size: 0.8rem;
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            margin: 0.125rem;
        }
        .product-item {
            cursor: pointer;
            transition: all 0.2s;
        }
        .product-item:hover {
            background-color: #f3f4f6;
        }
        .product-item.selected {
            background-color: #dbeafe;
            border-left: 3px solid #3b82f6;
        }
        .search-input {
            transition: all 0.2s;
        }
        .search-input:focus {
            outline: none;
            ring: 2px solid #3b82f6;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="topbar-container"></div>

    <div class="container mx-auto px-4 py-8">
        <div class="mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">
                <i class="fas fa-cog mr-2 text-purple-600"></i>产品属性管理
            </h1>
            <a href="products.html" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition flex items-center">
                <i class="fas fa-arrow-left mr-2"></i>返回产品列表
            </a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- 左侧：产品列表 -->
            <div class="lg:col-span-4">
                <div class="bg-white rounded-lg shadow-md p-4">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">
                        <i class="fas fa-box mr-2 text-blue-600"></i>选择产品
                    </h2>
                    
                    <!-- 产品搜索 -->
                    <div class="mb-4">
                        <input type="text" id="product-search" placeholder="搜索产品名称、SKU..." 
                               class="search-input w-full px-3 py-2 border border-gray-300 rounded-md">
                    </div>

                    <!-- 产品列表 -->
                    <div id="product-list-container" class="max-h-[60vh] overflow-y-auto">
                        <div class="text-center text-gray-400 py-8">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>加载产品中...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：属性管理 -->
            <div class="lg:col-span-8">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h2 class="text-lg font-semibold text-gray-800">
                                <i class="fas fa-sliders-h mr-2 text-purple-600"></i>属性设置
                            </h2>
                            <p id="selected-product-info" class="text-sm text-gray-500 mt-1">未选择产品</p>
                        </div>
                        <div class="flex space-x-2">
                            <button id="clear-attributes-btn" class="text-red-600 hover:text-red-800 text-sm flex items-center px-3 py-1 border border-red-300 rounded-md hover:bg-red-50 transition" disabled>
                                <i class="fas fa-trash mr-1"></i>清空所有属性
                            </button>
                        </div>
                    </div>

                    <!-- 选择分组 -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">选择属性分组</label>
                        <select id="attribute-group-select" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500" disabled>
                            <option value="">-- 请先选择产品 --</option>
                        </select>
                    </div>

                    <!-- 当前属性显示 -->
                    <div id="current-attributes-display" class="mb-4 hidden">
                        <label class="block text-sm font-medium text-gray-700 mb-2">当前属性值</label>
                        <div id="current-attributes-tags" class="flex flex-wrap gap-2">
                            <!-- 动态渲染 -->
                        </div>
                    </div>

                    <!-- 属性值表单 -->
                    <div id="attribute-form-container">
                        <div class="text-center text-gray-400 py-12">
                            <i class="fas fa-hand-pointer text-4xl mb-3"></i>
                            <p>请先在左侧选择一个产品，然后选择属性分组</p>
                        </div>
                    </div>

                    <!-- 保存按钮 -->
                    <div class="mt-6 flex justify-end space-x-3 border-t pt-4">
                        <button id="save-attributes-btn" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            <i class="fas fa-save mr-2"></i>保存属性
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载动画 -->
    <div id="loading" class="loading">
        <div class="bg-white rounded-lg p-6 shadow-xl">
            <i class="fas fa-spinner fa-spin text-3xl text-blue-600"></i>
            <p class="mt-2 text-gray-600">处理中...</p>
        </div>
    </div>

    <!-- 清空属性确认模态框 -->
    <div id="clear-attributes-modal" class="modal">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 fade-in">
            <div class="p-6">
                <div class="flex items-center justify-center mb-4">
                    <div class="bg-yellow-100 rounded-full p-3">
                        <i class="fas fa-exclamation-triangle text-yellow-600 text-2xl"></i>
                    </div>
                </div>
                <h3 class="text-lg font-semibold text-center mb-2">确认清空属性</h3>
                <p class="text-gray-600 text-center mb-6">确定要清空该产品的所有属性值吗？此操作不可恢复。</p>
                <div class="flex justify-center space-x-3">
                    <button id="cancel-clear-attributes" class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition">取消</button>
                    <button id="confirm-clear-attributes" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition">确认清空</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="/admin/common.js"></script>
    <script>
        let currentProductId = null;
        let currentProductName = '';
        let attributeValues = {};
        let allProducts = [];
        let selectedProductId = null;
        let templateNameMap = {}; // 存储模板名称映射

        // 从URL获取产品ID参数
        function getProductIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        // 加载所有属性模板名称
        async function loadAllTemplateNames() {
            try {
                const templates = await apiCall('GET', '/api/admin/attribute-templates');
                templateNameMap = {};
                templates.forEach(t => {
                    templateNameMap[t.id] = t.name;
                });
            } catch (err) {
                console.error('加载模板名称失败:', err);
                templateNameMap = {};
            }
        }

        // 加载产品列表
        async function loadProducts() {
            const container = document.getElementById('product-list-container');
            try {
                const result = await apiCall('GET', '/api/admin/products?page=1&per_page=100');
                allProducts = result.products || result.items || [];
                renderProductList(allProducts);
                
                // 先加载所有模板名称
                await loadAllTemplateNames();
                
                // 如果URL中有产品ID，自动选中
                const productIdFromUrl = getProductIdFromUrl();
                if (productIdFromUrl) {
                    const product = allProducts.find(p => p.id === productIdFromUrl);
                    if (product) {
                        await selectProduct(productIdFromUrl);
                    }
                }
            } catch (err) {
                console.error('加载产品失败:', err);
                container.innerHTML = `
                    <div class="text-center text-red-500 py-8">
                        <i class="fas fa-exclamation-circle text-2xl mb-2"></i>
                        <p>加载失败，请刷新重试</p>
                    </div>
                `;
            }
        }

        // 渲染产品列表
        function renderProductList(products) {
            const container = document.getElementById('product-list-container');
            if (!products || products.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-box-open text-2xl mb-2"></i>
                        <p>暂无产品</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="product-item px-3 py-2 rounded-md ${selectedProductId === p.id ? 'selected' : ''}" 
                     data-id="${p.id}" onclick="selectProduct('${p.id}')">
                    <div class="flex items-center justify-between">
                        <div class="flex-1 min-w-0">
                            <div class="font-medium text-gray-900 truncate">${escapeHtml(p.name)}</div>
                            <div class="text-sm text-gray-500 truncate">${escapeHtml(p.sku || '')}</div>
                        </div>
                        ${selectedProductId === p.id ? '<i class="fas fa-check text-blue-600"></i>' : ''}
                    </div>
                </div>
            `).join('');
        }

        // 搜索产品
        document.getElementById('product-search').addEventListener('input', function() {
            const keyword = this.value.toLowerCase().trim();
            if (!keyword) {
                renderProductList(allProducts);
                return;
            }
            const filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(keyword) || 
                (p.sku && p.sku.toLowerCase().includes(keyword))
            );
            renderProductList(filtered);
        });

        // 选择产品
        async function selectProduct(productId) {
            if (!productId) return;
            
            if (selectedProductId === productId) return;

            selectedProductId = productId;
            currentProductId = productId;
            
            // 更新选中状态
            document.querySelectorAll('.product-item').forEach(el => {
                const isSelected = el.dataset.id === productId;
                el.classList.toggle('selected', isSelected);
                const checkIcon = el.querySelector('.fa-check');
                if (checkIcon) {
                    checkIcon.style.display = isSelected ? 'inline-block' : 'none';
                }
            });

            // 更新选中产品信息
            const product = allProducts.find(p => p.id === productId);
            if (product) {
                currentProductName = product.name;
                document.getElementById('selected-product-info').textContent = `当前产品：${escapeHtml(product.name)} (SKU: ${escapeHtml(product.sku || 'N/A')})`;
            }

            // 启用相关控件
            document.getElementById('attribute-group-select').disabled = false;
            document.getElementById('save-attributes-btn').disabled = false;
            document.getElementById('clear-attributes-btn').disabled = false;

            // 加载产品属性
            await loadProductAttributes(productId);
            
            // 加载分组列表
            await loadAttributeGroups();
        }

        // 加载属性分组列表
        async function loadAttributeGroups() {
            try {
                const groups = await apiCall('GET', '/api/admin/attribute-groups');
                const select = document.getElementById('attribute-group-select');
                select.innerHTML = '<option value="">-- 请选择分组 --</option>';
                groups.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.id;
                    opt.textContent = g.name;
                    select.appendChild(opt);
                });
                
                select.value = '';
                document.getElementById('attribute-form-container').innerHTML = `
                    <div class="text-center text-gray-400 py-12">
                        <i class="fas fa-hand-pointer text-4xl mb-3"></i>
                        <p>请选择属性分组</p>
                    </div>
                `;
            } catch (err) {
                showNotification('加载分组失败: ' + err.message, 'error');
            }
        }

        // 加载产品的属性值
        async function loadProductAttributes(productId) {
            try {
                const values = await apiCall('GET', `/api/admin/products/${productId}/attribute-values`);
                attributeValues = {};
                
                // 为每个属性添加模板名称
                values.forEach(v => {
                    attributeValues[v.attribute_template_id] = v.value || '';
                    v.attribute_name = templateNameMap[v.attribute_template_id] || '属性';
                });
                
                // 显示当前属性
                displayCurrentAttributes(values);
            } catch (err) {
                console.error('加载产品属性值失败:', err);
                attributeValues = {};
                document.getElementById('current-attributes-display').classList.add('hidden');
            }
        }

        // 显示当前属性
        function displayCurrentAttributes(attributes) {
            const container = document.getElementById('current-attributes-display');
            const tagsContainer = document.getElementById('current-attributes-tags');
            
            if (!attributes || attributes.length === 0) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            tagsContainer.innerHTML = attributes.map(attr => {
                const name = templateNameMap[attr.attribute_template_id] || '属性';
                return `
                    <span class="attribute-value-display">
                        ${escapeHtml(name)}: ${escapeHtml(attr.value || '-')}
                    </span>
                `;
            }).join('');
        }

        // 分组选择变更 - 加载对应的属性模板
        document.getElementById('attribute-group-select').addEventListener('change', async function() {
            const groupId = this.value;
            if (!groupId) {
                document.getElementById('attribute-form-container').innerHTML = `
                    <div class="text-center text-gray-400 py-12">
                        <i class="fas fa-hand-pointer text-4xl mb-3"></i>
                        <p>请选择属性分组</p>
                    </div>
                `;
                return;
            }

            if (!selectedProductId) {
                showNotification('请先选择产品', 'error');
                return;
            }

            showLoading(true);
            try {
                const templates = await apiCall('GET', `/api/admin/attribute-groups/${groupId}/templates`);
                
                if (!templates || templates.length === 0) {
                    document.getElementById('attribute-form-container').innerHTML = `
                        <div class="text-center text-gray-400 py-12">
                            <i class="fas fa-info-circle text-4xl mb-3"></i>
                            <p>该分组暂无属性模板</p>
                            <p class="text-sm mt-2">请先在分组管理中添加模板</p>
                        </div>
                    `;
                    return;
                }

                // 两列网格布局
                let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
                templates.forEach(t => {
                    const options = t.value ? t.value.split(/\s+/).filter(s => s.trim()) : [];
                    const currentValue = attributeValues[t.id] || '';

                    html += `
                        <div class="border rounded-lg p-4 bg-gray-50 attribute-card">
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                ${escapeHtml(t.name)}
                                ${t.title ? `<span class="text-xs text-gray-400 ml-1">(${escapeHtml(t.title)})</span>` : ''}
                            </label>
                            ${options.length > 0 ? `
                                <select class="attribute-select" data-template-id="${t.id}">
                                    <option value="">-- 请选择 --</option>
                                    ${options.map(opt => `
                                        <option value="${escapeHtml(opt)}" ${opt === currentValue ? 'selected' : ''}>
                                            ${escapeHtml(opt)}
                                        </option>
                                    `).join('')}
                                </select>
                            ` : `
                                <input type="text" 
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500" 
                                       data-template-id="${t.id}"
                                       placeholder="请输入属性值"
                                       value="${escapeHtml(currentValue)}">
                            `}
                        </div>
                    `;
                });
                html += '</div>';
                document.getElementById('attribute-form-container').innerHTML = html;

            } catch (err) {
                showNotification('加载属性模板失败: ' + err.message, 'error');
                document.getElementById('attribute-form-container').innerHTML = `
                    <div class="text-center text-red-500 py-12">
                        <i class="fas fa-exclamation-circle text-4xl mb-3"></i>
                        <p>加载失败，请重试</p>
                    </div>
                `;
            } finally {
                showLoading(false);
            }
        });

        // 保存产品属性
        document.getElementById('save-attributes-btn').addEventListener('click', async function() {
            if (!selectedProductId) {
                showNotification('请先选择产品', 'error');
                return;
            }

            const values = [];
            const selects = document.querySelectorAll('#attribute-form-container select[data-template-id]');
            const inputs = document.querySelectorAll('#attribute-form-container input[data-template-id]');

            selects.forEach(select => {
                if (select.value) {
                    values.push({
                        attribute_template_id: parseInt(select.dataset.templateId),
                        value: select.value
                    });
                }
            });

            inputs.forEach(input => {
                if (input.value.trim()) {
                    values.push({
                        attribute_template_id: parseInt(input.dataset.templateId),
                        value: input.value.trim()
                    });
                }
            });

            if (values.length === 0) {
                showNotification('请至少设置一个属性值', 'error');
                return;
            }

            showLoading(true);
            try {
                await apiCall('PUT', `/api/admin/products/${selectedProductId}/attribute-values`, {
                    values: values
                });
                showNotification('属性保存成功', 'success');
                await loadProductAttributes(selectedProductId);
            } catch (err) {
                showNotification('保存失败: ' + err.message, 'error');
            } finally {
                showLoading(false);
            }
        });

        // 清空所有产品属性
        function clearAllAttributes() {
            if (!selectedProductId) {
                showNotification('请先选择产品', 'error');
                return;
            }
            document.getElementById('clear-attributes-modal').classList.add('show');
        }

        // 确认清空属性
        async function confirmClearAttributes() {
            if (!selectedProductId) return;

            showLoading(true);
            try {
                await apiCall('PUT', `/api/admin/products/${selectedProductId}/attribute-values`, {
                    values: []
                });
                showNotification('所有属性已清空', 'success');
                document.getElementById('clear-attributes-modal').classList.remove('show');
                await loadProductAttributes(selectedProductId);
                const groupSelect = document.getElementById('attribute-group-select');
                if (groupSelect.value) {
                    groupSelect.dispatchEvent(new Event('change'));
                }
            } catch (err) {
                showNotification('清空失败: ' + err.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        function cancelClearAttributes() {
            document.getElementById('clear-attributes-modal').classList.remove('show');
        }

        document.getElementById('clear-attributes-btn').addEventListener('click', clearAllAttributes);
        document.getElementById('confirm-clear-attributes').addEventListener('click', confirmClearAttributes);
        document.getElementById('cancel-clear-attributes').addEventListener('click', cancelClearAttributes);

        // 辅助函数
        function showLoading(show) {
            const el = document.getElementById('loading');
            if (show) el.classList.add('show');
            else el.classList.remove('show');
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `toast fixed top-20 right-4 px-4 py-2 rounded shadow-lg z-50 ${type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`;
            notification.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2"></i>${message}`;
            document.body.appendChild(notification);
            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        document.getElementById('clear-attributes-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('clear-attributes-modal')) {
                document.getElementById('clear-attributes-modal').classList.remove('show');
            }
        });

        // 初始化
        requireAuth().then(async () => {
            await loadTopbar();
            await loadFooter();
            await loadProducts();
        }).catch(() => {});
    </script>
</body>
</html>
