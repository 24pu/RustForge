<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="common.js"></script>
    <style>
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            border-radius: 0.5rem;
            max-width: 800px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem;
            position: relative;
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: #e5e7eb;
            border: none;
            border-radius: 9999px;
            width: 2rem;
            height: 2rem;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .modal-close:hover { background: #d1d5db; }
        .fade-in { animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-paid { background: #dbeafe; color: #1e40af; }
        .status-shipped { background: #d1fae5; color: #065f46; }
        .status-completed { background: #d1fae5; color: #065f46; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }
        .stat-card { transition: all 0.2s; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .order-row { cursor: pointer; transition: background 0.15s; }
        .order-row:hover { background: #f9fafb; }
    </style>
</head>
<body class="bg-gray-100">
    <div id="topbar-container"></div>

    <div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">
                <i class="fas fa-clipboard-list mr-2 text-purple-600"></i>订单管理
            </h1>
            <button id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">
                <i class="fas fa-sync-alt mr-2"></i>刷新
            </button>
        </div>

        <!-- 统计卡片 -->
        <div id="stats-container" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
            <div class="stat-card bg-white rounded-lg shadow p-4 text-center">
                <div class="text-2xl font-bold text-gray-800" id="stat-total">-</div>
                <div class="text-sm text-gray-500">总订单</div>
            </div>
            <div class="stat-card bg-white rounded-lg shadow p-4 text-center border-l-4 border-yellow-500">
                <div class="text-2xl font-bold text-yellow-600" id="stat-pending">-</div>
                <div class="text-sm text-gray-500">待付款</div>
            </div>
            <div class="stat-card bg-white rounded-lg shadow p-4 text-center border-l-4 border-blue-500">
                <div class="text-2xl font-bold text-blue-600" id="stat-paid">-</div>
                <div class="text-sm text-gray-500">已付款</div>
            </div>
            <div class="stat-card bg-white rounded-lg shadow p-4 text-center border-l-4 border-green-500">
                <div class="text-2xl font-bold text-green-600" id="stat-shipped">-</div>
                <div class="text-sm text-gray-500">已发货</div>
            </div>
            <div class="stat-card bg-white rounded-lg shadow p-4 text-center border-l-4 border-red-500">
                <div class="text-2xl font-bold text-red-600" id="stat-cancelled">-</div>
                <div class="text-sm text-gray-500">已取消</div>
            </div>
        </div>

        <!-- 筛选栏 -->
        <div class="bg-white rounded-lg shadow p-4 mb-6">
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex items-center space-x-2">
                    <label class="text-sm font-medium text-gray-700">状态筛选</label>
                    <select id="filter-status" class="border rounded px-3 py-1.5 text-sm focus:ring-2 focus:ring-purple-500">
                        <option value="">全部</option>
                        <option value="pending">待付款</option>
                        <option value="paid">已付款</option>
                        <option value="shipped">已发货</option>
                        <option value="completed">已完成</option>
                        <option value="cancelled">已取消</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <label class="text-sm font-medium text-gray-700">搜索</label>
                    <input type="text" id="search-input" placeholder="订单号..." class="border rounded px-3 py-1.5 text-sm w-48 focus:ring-2 focus:ring-purple-500">
                </div>
                <button id="filter-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-1.5 rounded text-sm transition">筛选</button>
                <button id="reset-filter-btn" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-1.5 rounded text-sm transition">重置</button>
            </div>
        </div>

        <!-- 订单列表 -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">订单号</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">用户</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">金额</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">创建时间</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="orders-list" class="bg-white divide-y divide-gray-200">
                        <tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <!-- 分页 -->
            <div id="pagination" class="px-6 py-4 border-t border-gray-200 flex justify-between items-center">
                <div id="pagination-info" class="text-sm text-gray-600"></div>
                <div class="flex space-x-2">
                    <button id="prev-page" class="px-3 py-1 border rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">上一页</button>
                    <span id="page-current" class="px-3 py-1 bg-purple-600 text-white rounded">1</span>
                    <button id="next-page" class="px-3 py-1 border rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 订单详情模态框 ========== -->
    <div id="detail-modal" class="modal">
        <div class="modal-content fade-in">
            <button class="modal-close" id="close-detail-modal">&times;</button>
            <h2 class="text-xl font-bold mb-4 flex items-center">
                <i class="fas fa-file-invoice text-purple-600 mr-2"></i>订单详情
                <span id="detail-order-number" class="text-sm text-gray-500 ml-3 font-normal"></span>
            </h2>
            <div id="detail-content" class="space-y-4">
                <p class="text-gray-500">加载中...</p>
            </div>
            <div class="mt-4 flex justify-end">
                <button class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded transition" onclick="closeDetailModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- ========== 更新状态模态框 ========== -->
    <div id="status-modal" class="modal">
        <div class="modal-content max-w-md fade-in">
            <button class="modal-close" id="close-status-modal">&times;</button>
            <h2 class="text-xl font-bold mb-4">更新订单状态</h2>
            <form id="status-form">
                <input type="hidden" id="status-order-id">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">选择状态</label>
                    <select id="status-select" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-purple-500">
                        <option value="pending">待付款</option>
                        <option value="paid">已付款</option>
                        <option value="shipped">已发货</option>
                        <option value="completed">已完成</option>
                        <option value="cancelled">已取消</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded transition" onclick="closeStatusModal()">取消</button>
                    <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded transition">确认更新</button>
                </div>
            </form>
        </div>
    </div>

    <div id="footer-container"></div>

    <script>
        let currentPage = 1;
        const perPage = 20;
        let totalPages = 1;
        let currentFilters = { status: '', keyword: '' };

        // ---- 获取权限 ----
        let canManageOrder = false;

        // ---- 加载统计 ----
        async function loadStats() {
            try {
                const data = await apiCall('GET', '/api/orders/stats');
                document.getElementById('stat-total').textContent = data.total_orders || 0;
                document.getElementById('stat-pending').textContent = data.pending?.count || 0;
                document.getElementById('stat-paid').textContent = data.paid?.count || 0;
                document.getElementById('stat-shipped').textContent = data.shipped?.count || 0;
                document.getElementById('stat-cancelled').textContent = data.cancelled?.count || 0;
            } catch (e) {
                console.warn('加载统计失败:', e);
            }
        }

        // ---- 加载订单列表 ----
        async function loadOrders(page = 1) {
            const tbody = document.getElementById('orders-list');
            tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i>加载中...</td></tr>';

            try {
                let url = `/api/admin/orders?page=${page}&per_page=${perPage}`;
                if (currentFilters.status) url += `&status=${encodeURIComponent(currentFilters.status)}`;
                if (currentFilters.keyword) url += `&keyword=${encodeURIComponent(currentFilters.keyword)}`;

                const data = await apiCall('GET', url);
                const orders = data.items || data.orders || [];
                totalPages = data.total_pages || Math.ceil((data.total || 0) / perPage) || 1;
                currentPage = page;

                renderOrders(orders);
                updatePagination(data.total || 0);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-red-500">加载失败: ${err.message}</td></tr>`;
            }
        }

        // ---- 渲染订单 ----
        function renderOrders(orders) {
            const tbody = document.getElementById('orders-list');
            if (!orders || orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">暂无订单</td></tr>';
                return;
            }

            let html = '';
            for (const order of orders) {
                const statusClass = `status-${order.status}`;
                const statusMap = {
                    pending: '待付款', paid: '已付款', shipped: '已发货',
                    completed: '已完成', cancelled: '已取消'
                };
                const statusText = statusMap[order.status] || order.status;
                const created = new Date(order.created_at).toLocaleString('zh-CN');
                html += `
                    <tr class="order-row" onclick="viewOrder('${order.id}')">
                        <td class="px-6 py-4 text-sm font-medium text-gray-900">${escapeHtml(order.order_number)}</td>
                        <td class="px-6 py-4 text-sm text-gray-600">${escapeHtml(order.shipping_name || order.user_id?.substring(0,8) || '-')}</td>
                        <td class="px-6 py-4 text-sm font-semibold text-gray-900">¥${order.total_amount.toFixed(2)}</td>
                        <td class="px-6 py-4"><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td class="px-6 py-4 text-sm text-gray-500">${created}</td>
                        <td class="px-6 py-4 text-sm">
                            <button onclick="event.stopPropagation(); viewOrder('${order.id}')" class="text-blue-600 hover:text-blue-800 mr-2" title="查看详情">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button onclick="event.stopPropagation(); openStatusModal('${order.id}', '${order.status}')" class="text-purple-600 hover:text-purple-800" title="更新状态" ${canManageOrder ? '' : 'disabled style="opacity:0.5;cursor:not-allowed;"'}>
                                <i class="fas fa-edit"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }
            tbody.innerHTML = html;
        }

        // ---- 分页 ----
        function updatePagination(total) {
            const totalPages = Math.ceil(total / perPage) || 1;
            document.getElementById('pagination-info').textContent = `共 ${total} 条，第 ${currentPage}/${totalPages} 页`;
            document.getElementById('page-current').textContent = currentPage;
            document.getElementById('prev-page').disabled = currentPage <= 1;
            document.getElementById('next-page').disabled = currentPage >= totalPages;
        }

        // ---- 查看订单详情 ----
        async function viewOrder(orderId) {
            try {
                const order = await apiCall('GET', `/api/admin/orders/${orderId}`);
                renderDetail(order);
                document.getElementById('detail-modal').classList.add('show');
            } catch (err) {
                alert('加载订单详情失败: ' + err.message);
            }
        }

        function renderDetail(order) {
            document.getElementById('detail-order-number').textContent = `#${order.order_number}`;
            const statusMap = {
                pending: '待付款', paid: '已付款', shipped: '已发货',
                completed: '已完成', cancelled: '已取消'
            };
            const statusClass = `status-${order.status}`;

            let itemsHtml = '';
            if (order.items && order.items.length > 0) {
                itemsHtml = `
                    <div class="border-t pt-4 mt-4">
                        <h4 class="font-medium text-gray-700 mb-2">商品明细</h4>
                        <table class="min-w-full text-sm">
                            <thead class="bg-gray-50"><tr>
                                <th class="px-3 py-2 text-left">商品</th>
                                <th class="px-3 py-2 text-center">数量</th>
                                <th class="px-3 py-2 text-right">单价</th>
                                <th class="px-3 py-2 text-right">小计</th>
                            </tr></thead>
                            <tbody>
                                ${order.items.map(item => `
                                    <tr class="border-t">
                                        <td class="px-3 py-2">
                                            ${escapeHtml(item.product_name)}
                                            ${item.variant_sku ? `<span class="text-xs text-gray-400">(${escapeHtml(item.variant_sku)})</span>` : ''}
                                        </td>
                                        <td class="px-3 py-2 text-center">${item.quantity}</td>
                                        <td class="px-3 py-2 text-right">¥${item.price.toFixed(2)}</td>
                                        <td class="px-3 py-2 text-right font-medium">¥${item.total.toFixed(2)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                            <tfoot class="border-t">
                                <tr><td colspan="3" class="px-3 py-2 text-right font-bold">合计</td>
                                <td class="px-3 py-2 text-right font-bold text-red-600">¥${order.total_amount.toFixed(2)}</td></tr>
                            </tfoot>
                        </table>
                    </div>
                `;
            }

            document.getElementById('detail-content').innerHTML = `
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <div><span class="text-gray-500">订单号</span><br><span class="font-medium">${escapeHtml(order.order_number)}</span></div>
                    <div><span class="text-gray-500">状态</span><br><span class="status-badge ${statusClass}">${statusMap[order.status] || order.status}</span></div>
                    <div><span class="text-gray-500">收货人</span><br><span class="font-medium">${escapeHtml(order.shipping_name || '-')}</span></div>
                    <div><span class="text-gray-500">联系电话</span><br><span class="font-medium">${escapeHtml(order.shipping_phone || '-')}</span></div>
                    <div class="col-span-2"><span class="text-gray-500">收货地址</span><br><span class="font-medium">${escapeHtml(order.shipping_address || '-')}</span></div>
                    ${order.note ? `<div class="col-span-2"><span class="text-gray-500">备注</span><br><span class="font-medium">${escapeHtml(order.note)}</span></div>` : ''}
                    <div><span class="text-gray-500">创建时间</span><br><span class="font-medium">${new Date(order.created_at).toLocaleString('zh-CN')}</span></div>
                    ${order.paid_at ? `<div><span class="text-gray-500">支付时间</span><br><span class="font-medium">${new Date(order.paid_at).toLocaleString('zh-CN')}</span></div>` : ''}
                    <div class="col-span-2 text-right text-lg"><span class="text-gray-500">订单金额</span> <span class="font-bold text-red-600">¥${order.total_amount.toFixed(2)}</span></div>
                </div>
                ${itemsHtml}
                ${canManageOrder ? `<div class="mt-4 flex justify-end"><button onclick="closeDetailModal(); openStatusModal('${order.id}', '${order.status}')" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded transition">更新状态</button></div>` : ''}
            `;
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.remove('show');
        }

        // ---- 更新状态 ----
        function openStatusModal(orderId, currentStatus) {
            if (!canManageOrder) {
                alert('您没有权限更新订单状态');
                return;
            }
            document.getElementById('status-order-id').value = orderId;
            document.getElementById('status-select').value = currentStatus;
            document.getElementById('status-modal').classList.add('show');
        }

        function closeStatusModal() {
            document.getElementById('status-modal').classList.remove('show');
        }

        document.getElementById('status-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const orderId = document.getElementById('status-order-id').value;
            const status = document.getElementById('status-select').value;
            try {
                await apiCall('PUT', `/api/admin/orders/${orderId}/status`, { status });
                alert('状态更新成功');
                closeStatusModal();
                await loadOrders(currentPage);
                await loadStats();
            } catch (err) {
                alert('更新失败: ' + err.message);
            }
        });

        // ---- 筛选 ----
        document.getElementById('filter-btn').addEventListener('click', function() {
            currentFilters.status = document.getElementById('filter-status').value;
            currentFilters.keyword = document.getElementById('search-input').value.trim();
            loadOrders(1);
        });

        document.getElementById('reset-filter-btn').addEventListener('click', function() {
            document.getElementById('filter-status').value = '';
            document.getElementById('search-input').value = '';
            currentFilters = { status: '', keyword: '' };
            loadOrders(1);
        });

        // ---- 分页控制 ----
        document.getElementById('prev-page').addEventListener('click', () => {
            if (currentPage > 1) loadOrders(currentPage - 1);
        });
        document.getElementById('next-page').addEventListener('click', () => {
            if (currentPage < totalPages) loadOrders(currentPage + 1);
        });
        document.getElementById('refresh-btn').addEventListener('click', () => loadOrders(currentPage));

        // ---- 模态框关闭（点击背景） ----
        document.getElementById('detail-modal').addEventListener('click', function(e) {
            if (e.target === this) closeDetailModal();
        });
        document.getElementById('status-modal').addEventListener('click', function(e) {
            if (e.target === this) closeStatusModal();
        });
        document.getElementById('close-detail-modal').addEventListener('click', closeDetailModal);
        document.getElementById('close-status-modal').addEventListener('click', closeStatusModal);

        // ---- 搜索回车 ----
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('filter-btn').click();
        });

        // ---- 初始化 ----
        requireAuth().then(async () => {
            await loadTopbar();
            await loadFooter();

            const perms = await fetchUserPermissions();
            if (!perms.includes('order:list')) {
                document.getElementById('orders-list').innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-red-500">您没有权限查看订单</td></tr>';
                document.getElementById('stats-container').style.display = 'none';
                document.querySelector('.bg-white.rounded-lg.shadow.p-4.mb-6').style.display = 'none';
                return;
            }

            canManageOrder = perms.includes('order:manage') || perms.includes('admin');
            await loadStats();
            await loadOrders(1);
        });
    </script>
</body>
</html>
